name: web

# Deploys web/ to Cloudflare as a Worker with static assets.
#
# Not Pages: Cloudflare's dashboard now calls that the "legacy Pages workflow"
# and its docs carry a migration banner, so a site started in late 2026 belongs
# on Workers. Config is web/wrangler.jsonc. See web/docs/WEB_ARCHITECTURE.md.
#
# Deploying from Actions rather than from Workers Builds keeps the checkout
# sparse and submodule-free — the repo carries libDaisy and DaisySP, which the
# site has no use for.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-latest
    # The Cloudflare credentials are environment secrets on the `deploy`
    # environment, not repository secrets, so the job has to opt in by name —
    # without this, secrets.CLOUDFLARE_API_TOKEN silently resolves to empty
    # and wrangler fails as if no token were ever set.
    environment: deploy
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # submodules: false is already the default — stated because it is the
          # whole reason this workflow exists instead of the Pages integration.
          submodules: false
          fetch-depth: 1
          # The claim guardrail reads evidence out of the hardware tree, so
          # those paths have to be present. The submodules, gerbers, 3D models
          # and renders are not pulled.
          #
          # Non-cone mode, because cone mode can only include whole
          # directories. The Rev B board folders are 2-10 MB each of gerbers
          # and fab outputs wrapped around one README the audit cites; the
          # `*.md` pattern takes the eight markdown files and leaves 23 MB of
          # manufacturing data behind. Verified against a scratch clone: the
          # eight land, zero gerbers do, and check-claims.mjs resolves all 97
          # citations.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /web/
            /rodeo-sdk/
            /rodeo-motherboard/docs/
            /rodeo-motherboard/kicad/
            /rodeo-001/docs/
            /rodeo-001/firmware/src/
            /rodeo-002/firmware/common/
            /rodeo-encoder-hub/firmware/
            /rodeo-potentiometer/
            /rodeo-encoder/
            /rodeo-button/
            /rev-b/**/*.md

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Check
        working-directory: web
        # astro check + claim citations + asset budgets. A failure here stops
        # the deploy rather than shipping copy that outran the hardware.
        run: npm run check

      - name: Build
        working-directory: web
        env:
          # Gates the noindex tag in BaseHead. Anything other than 'production'
          # ships noindex, so preview deployments cannot be indexed under the
          # real brand.
          SITE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          # Public by design — it is read off the page by Turnstile's script,
          # so it is a variable, not a secret. Unset until the widget exists,
          # and unset means no widget is rendered and the Worker logs that it
          # is not verifying. Its partner TURNSTILE_SECRET is a Worker secret
          # and never passes through this workflow.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      # main -> production. The Worker is created on first deploy; there is
      # nothing to pre-create in the dashboard.
      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy

      # Token scope is the thing that goes wrong here, and the API error
      # ("No access to the specified resource") does not say which permission
      # is missing. Printing whoami on failure shows the account and the
      # granted scopes, so the next attempt is a diagnosis rather than a guess.
      - name: Diagnose token scope
        if: failure()
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami || true

      # PRs -> a preview version with its own URL, never promoted to
      # production. `preview_urls: true` in wrangler.jsonc enables these.
      #
      # DRY_RUN=1 is set on the version, not in wrangler.jsonc, so it applies
      # to previews and to nothing else. The subscribe handler then runs every
      # check and stops before Buttondown — a preview cannot write to the real
      # list. Production has no DRY_RUN because `wrangler deploy` clears vars
      # absent from the config.
      - name: Upload preview version
        id: preview
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: versions upload --var DRY_RUN:1

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const out = `${{ steps.preview.outputs.command-output }}`;
            const match = out.match(/https:\/\/[^\s]*workers\.dev[^\s]*/);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: match
                ? `Preview: ${match[0]}`
                : 'Preview uploaded — URL is in the workflow log.',
            });

