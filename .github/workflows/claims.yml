name: claims

# The loop-closer, and deliberately its own workflow.
#
# `on.paths` filters at the workflow level, not per job, so this cannot live
# inside web.yml: a commit touching only the hardware tree would not trigger
# that workflow at all, and the check that exists precisely for that commit
# would never run.
#
# What it enforces: every public claim in web/src/data/boards.ts cites a real
# line of evidence in the repo, and no claim marked shipped sits next to a
# TODO. See web/docs/WEB_CLAIMS_AUDIT.md.

on:
  push:
    branches: [main]
    paths:
      - 'instruments/rodeo-001/**'
      - 'instruments/rodeo-002/**'
      - 'rodeo-sdk/**'
      - 'rev-a/rodeo-motherboard/**'
      - 'rev-a/rodeo-encoder-hub/**'
      - 'rev-a/rodeo-encoder/**'
      - 'rev-a/rodeo-potentiometer/**'
      - 'rev-a/rodeo-button/**'
      - 'web/src/data/**'
      - 'web/docs/**'
      - 'web/scripts/check-claims.mjs'
      - 'hardware/**'
      - '.github/workflows/claims.yml'
  pull_request:
    paths:
      - 'instruments/rodeo-001/**'
      - 'instruments/rodeo-002/**'
      - 'rodeo-sdk/**'
      - 'rev-a/rodeo-motherboard/**'
      - 'rev-a/rodeo-encoder-hub/**'
      - 'rev-a/rodeo-encoder/**'
      - 'rev-a/rodeo-potentiometer/**'
      - 'rev-a/rodeo-button/**'
      - 'web/src/data/**'
      - 'web/docs/**'
      - 'web/scripts/check-claims.mjs'
      - 'hardware/**'
      - '.github/workflows/claims.yml'
  workflow_dispatch:

concurrency:
  group: claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims:
    name: claims still hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1
          # Same file list as web.yml, which explains it: non-cone mode so the Rev B
          # board folders contribute their markdown and not their fab outputs. Keep
          # the two lists identical; both run check-claims.mjs.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /web/
            /rodeo-sdk/
            /rev-a/rodeo-motherboard/docs/
            /rev-a/rodeo-motherboard/kicad/
            /rev-a/rodeo-encoder-hub/firmware/
            /rev-a/rodeo-potentiometer/
            /rev-a/rodeo-encoder/
            /rev-a/rodeo-button/
            /instruments/rodeo-001/docs/
            /instruments/rodeo-001/firmware/src/
            /instruments/rodeo-002/firmware/common/
            /hardware/**/*.md
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Verify evidence
        working-directory: web
        run: npm run claims
